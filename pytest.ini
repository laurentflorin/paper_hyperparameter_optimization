[pytest]
addopts = --strict-markers
testpaths = tests
markers =
    unit: Pure unit test with no external Bayesian-package requirement.
    integration: Cross-module or workflow test not required in minimal CI.
    slow: Longer-running test not required in minimal CI.
    requires_covbayesvar: Test requires the optional covbayesvar dependency.
    requires_mbfvar: Test requires the optional MBFVAR dependency.